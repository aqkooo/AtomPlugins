# ========================================================
#                    GlowSeller Shop
# ========================================================
# Настройка предметов магазина скупщика.
# Все предметы на 100% настраиваются здесь!
#
# Параметры предмета:
#   material: Материал (LIME_CONCRETE, DIAMOND_SWORD и т.д.) или basehead-<хеш>
#   slot: Номер слота в меню (0-53)
#   name: Название предмета (поддерживает цвета &, &#HEX)
#   lore: Описание предмета (список строк)
#   price: Цена в очках скупщика (целое число)
#   type: Тип награды:
#         - BOOSTER (временный бустер множителя монет скупщика)
#         - COMMAND (выполнение консольных команд, плейсхолдер %player%)
#         - ITEM    (выдача самого предмета в инвентарь игрока)
#   multiplier: Множитель (только для type: BOOSTER, например 1.25)
#   duration: Длительность в секундах (для type: BOOSTER, например 3600 = 1 час)
#   give-amount: Количество выдаваемых предметов (для type: ITEM)
#   commands: Список команд для выполнения (для type: COMMAND)
#   custom_model_data: Номер CustomModelData (число, опционально)
#   permission: Необходимое право для покупки (опционально)
#   limit: Лимит покупок: 'once' (один раз), 'daily' (раз в 24ч), число (например 1, 3), 'unlimited'

