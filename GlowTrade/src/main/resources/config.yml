# ==============================================================================
#                      GlowTrade — Конфигурация плагина
#              Разработчики: ejyqyl / atomicsqd | Стиль: ReallyWorld
# ==============================================================================

settings:
  # Время действия запроса на обмен в секундах (по умолчанию: 30)
  request-timeout: 30

  # Длительность обратного отсчета подтверждения в секундах
  countdown-seconds: 3

  # Ограничение по расстоянию между игроками
  distance:
    enabled: true
    max-distance: 15.0
    require-same-world: true

  # Отправка запроса по Shift + ПКМ по другому игроку
  shift-click-request: true

  # Ограничения безопасности
  restrictions:
    # Запретить обмен в Креативе
    prevent-creative: true
    # Запретить обмен в Спектаторе
    prevent-spectator: true
    # Запретить обмен во время PvP боя (CombatLogX / PvPManager / собственный таймер боя)
    prevent-in-combat: true
    # Отменять обмен при получении урона
    cancel-on-damage: true
    # Отменять обмен если игроки разошлись слишком далеко
    cancel-on-distance-exceeded: true
    # Блокировать передачу предметов, переименованных в наковальне (Anti-Scam ReallyWorld)
    block-anvil-renamed-items: true

  # Черный список предметов, запрещенных к обмену
  blacklist:
    # Запрещенные материалы
    materials:
      - BEDROCK
      - BARRIER
      - STRUCTURE_BLOCK
      - COMMAND_BLOCK
      - CHAIN_COMMAND_BLOCK
      - REPEATING_COMMAND_BLOCK
    # Запрещенные значения CustomModelData (целые числа)
    custom-model-data: []
    # Запрещенные NBT/PDC строковые теги (например "untradeable", "nodrop")
    nbt-tags:
      - "untradeable"
      - "nodrop"

# Звуковое сопровождение (безопасные названия из Bukkit Sound)
sounds:
  enabled: true
  request-sent: "ENTITY_EXPERIENCE_ORB_PICKUP"
  request-received: "BLOCK_NOTE_BLOCK_PLING"
  ready-toggle: "UI_BUTTON_CLICK"
  timer-tick: "BLOCK_NOTE_BLOCK_HAT"
  trade-success: "ENTITY_PLAYER_LEVELUP"
  trade-cancel: "BLOCK_NOTE_BLOCK_BASS"
  anti-scam-alert: "ENTITY_VILLAGER_NO"

# Визуальное оформление GUI обмена
gui:
  # Заголовок меню (поддерживает градиенты GlowTrade)
  title: "<gradient:#FFA500:#FFD700>Безопасный обмен предметами</gradient>"

  # Материалы декоративных элементов
  separator-material: "GRAY_STAINED_GLASS_PANE"
  filler-material: "BLACK_STAINED_GLASS_PANE"
  
  # Кнопки готовности
  ready-buttons:
    not-ready-material: "RED_STAINED_GLASS_PANE"
    ready-material: "LIME_STAINED_GLASS_PANE"
    
  # Индикатор таймера
  timer-indicator:
    waiting-material: "YELLOW_STAINED_GLASS_PANE"
    active-material: "CLOCK"
